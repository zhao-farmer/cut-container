<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CutContainer · 原生示例（经典脚本）</title>
    <style>
      html, body { margin: 0; height: 100%; background: #171718; }
      #app { height: 100%; }
      #status {
        position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; color: #d8d8dc;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #171718;
      }
    </style>
  </head>
  <body>
    <div id="status">加载依赖与用户配置…</div>
    <div id="app"></div>

    <!-- 经典脚本（非 type=module）：pixi.js → mediabunny → 本项目 -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.12.0/dist/pixi.min.js"></script>
    <script src="../npm-build-dist/dist/vendor/mediabunny.min.js"></script>
    <script src="../npm-build-dist/dist/cut-container.js"></script>
    <script>
      (async () => {
        const status = document.getElementById('status')
        try {
          if (!window.PIXI || !window.Mediabunny || !window.CutContainer) {
            throw new Error('依赖未加载：请确认 pixi.min.js / mediabunny.min.js / cut-container.js 顺序正确')
          }

          // 1) 创建对象（不会立即挂载）
          const app = CutContainer.createApp({
            host: '#app',
            onImportTracks: async () => null,
            onExportTracks: async config => console.log('[经典脚本示例] 导出轨道配置', config)
          })
          window.demoApp = app

          // 2) 加载外部配置；file:// 下 fetch 受限时回退到内联配置
          try {
            await app.loadConfig('./user-config.json')
            status.textContent = '配置加载完成，正在启动编辑器…'
          } catch (err) {
            console.warn('[示例] 外部配置加载失败，改用内联配置：', err)
            await app.loadConfig({
              title: '原生示例（内联配置）',
              tabs: ['material', 'audio', 'text', 'caption'],
              backend: { enabled: false, baseUrl: '', timeoutMs: 8000 }
            })
            status.textContent = '外部配置不可用，已使用内联配置启动…'
          }

          // 3) 配置就绪后才真正挂载
          await app.mount()
          status.style.display = 'none'
          console.log('已挂载 <cut-container>', app.element, '当前配置：', app.getConfig())
        } catch (err) {
          console.error(err)
          status.textContent = `启动失败：${err?.message || err}`
        }
      })()
    </script>
  </body>
</html>
