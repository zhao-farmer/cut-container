<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CutContainer · Vue CDN 示例</title>
    <style>
      html, body { margin: 0; height: 100%; background: #171718; }
      #app { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- 经典脚本：pixi.js → mediabunny → 本项目 -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.12.0/dist/pixi.min.js"></script>
    <script src="../npm-build-dist/dist/vendor/mediabunny.min.js"></script>
    <script src="../npm-build-dist/dist/cut-container.js"></script>
    <script>
      const { createApp, h, onMounted, onBeforeUnmount, ref } = Vue

      const App = {
        setup() {
          const host = ref(null)
          onMounted(async () => {
            await CutContainer.mountEditor(host.value, { title: 'Vue CDN 示例' })
          })
          onBeforeUnmount(() => host.value?.unmount())
          return () =>
            h('cut-container', {
              ref: host,
              style: 'display:block;width:100%;height:100%'
            })
        }
      }

      createApp(App).mount('#app')
    </script>
  </body>
</html>
